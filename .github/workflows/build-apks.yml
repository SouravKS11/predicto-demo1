name: Build DC13 test APKs
on:
  push:
    branches: [dc13-android-apps]
    paths-ignore: ['apks/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build customer, driver and merchant APKs
        run: gradle --no-daemon assembleCustomerRelease assembleDriverRelease assembleMerchantRelease
      - name: Collect APKs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/customer/release/app-customer-release.apk apks/DC13-Customer.apk
          cp app/build/outputs/apk/driver/release/app-driver-release.apk apks/DC13-Driver.apk
          cp app/build/outputs/apk/merchant/release/app-merchant-release.apk apks/DC13-Merchant.apk
          ls -la apks
      - uses: actions/upload-artifact@v4
        with: { name: dc13-apks, path: apks/*.apk }
      - name: Save APKs to the branch
        run: |
          git config user.name "dc13-build"
          git config user.email "build@users.noreply.github.com"
          git add apks/*.apk
          git commit -m "Built APKs ${GITHUB_SHA::7} [skip ci]" || echo "no change"
          git push
