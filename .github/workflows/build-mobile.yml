name: Build DC13 mobile apps
on:
  push:
    branches: [dc13-mobile-apps]
    paths-ignore: ['apks/**', 'shots/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: dc13-mobile, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Capacitor
        run: npm ci --no-audit --no-fund
      - name: Build the four APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleCustomerRelease assembleCourierRelease assembleStoreRelease assembleAdminRelease
      - name: Collect APKs
        run: |
          mkdir -p apks
          cp android/app/build/outputs/apk/customer/release/app-customer-release.apk apks/DC13-Customer.apk
          cp android/app/build/outputs/apk/courier/release/app-courier-release.apk apks/DC13-Courier.apk
          cp android/app/build/outputs/apk/store/release/app-store-release.apk apks/DC13-Store.apk
          cp android/app/build/outputs/apk/admin/release/app-admin-release.apk apks/DC13-Admin.apk
          ls -la apks
      - uses: actions/upload-artifact@v4
        with: { name: dc13-apks, path: apks/ }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open each app on a Pixel emulator
        timeout-minutes: 25
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/smoke.sh
      - name: Save APKs and screenshots to the branch
        if: always()
        run: |
          git config user.name "dc13-build"
          git config user.email "build@users.noreply.github.com"
          git add -f apks shots || true
          git commit -m "APKs and emulator screenshots ${GITHUB_SHA::7} [skip ci]" || echo "no change"
          for i in 1 2 3; do git pull --rebase -q origin dc13-mobile-apps && git push && break; sleep 5; done
