name: live-check
on:
  push:
    paths: ['.github/workflows/live-check.yml']
permissions: { contents: write }
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p live
          curl -sS https://dc13-delivery-demo.netlify.app/ -o live/index.html
          sha256sum live/index.html
          git config user.email ci@dc13; git config user.name ci
          git add live && git commit -m "Live snapshot" && git push
