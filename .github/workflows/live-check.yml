name: live-check
on: push
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          curl -sS https://dc13-delivery-demo.netlify.app/ -o out/index.html
          curl -sS https://dc13-delivery-demo.netlify.app/netlify.toml -o out/netlify.toml || true
          curl -sS -o /dev/null -w "%{http_code}\n" https://dc13-delivery-demo.netlify.app/_redirects
          sha256sum out/*
      - uses: actions/upload-artifact@v4
        with: { name: live, path: out }
