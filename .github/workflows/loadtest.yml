name: DC13 load test
# Started by committing loadtest/RUN containing "smoke" or "peak"
on:
  push:
    branches: [dc13-mobile-apps]
    paths: ['loadtest/RUN']
jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run k6
        env:
          SUPABASE_URL: https://xdlpuvbguipgeszyngek.supabase.co
          MODE: placeholder
        run: |
          export MODE=$(head -1 loadtest/RUN | tr -d '[:space:]')
          # the public (anon) key that ships inside the customer app
          export SUPABASE_ANON=$(grep -ohE 'sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' android/app/src/customer/assets/public/assets/*.js | head -1)
          test -n "$SUPABASE_ANON"
          k6 run --quiet loadtest/dc13.js 2>&1 | tail -150 | tee loadtest/console.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadtest-results
          path: loadtest/
