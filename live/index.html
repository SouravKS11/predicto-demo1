<title>DC13 Delivery · Test Environment</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0B0A08;--panel:#121110;--panel2:#1A1512;--line:#232120;--line2:#2F2B27;
  --fg:#ECE6DC;--muted:#8E877B;--faint:#5F5A50;
  --accent:#FF5101;--accent2:#FF7A3C;--on-accent:#12100E;
  --ok:#6DBE8C;--warn:#E3A93B;--bad:#E5574B;--chip:#1C1916;
  --f-display:'Fraunces',Georgia,serif;--f-body:'Inter','Segoe UI',Arial,sans-serif;--f-mono:'JetBrains Mono',Consolas,Menlo,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1);
}
.light{--bg:#F7F3EC;--panel:#FFFFFF;--panel2:#EFE8DC;--line:#E4DCCF;--line2:#D3C9B8;--fg:#14110C;--muted:#6B6458;--faint:#9C9486;--accent:#D8420A;--chip:#ECE5D8;--ok:#2F8A57;--warn:#A86F0C;--bad:#C2372C;color-scheme:light;color:var(--fg)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:500;text-wrap:balance}
p{margin:0}
a{color:inherit}
.serif{font-family:var(--f-display)}.mono{font-family:var(--f-mono)}.muted{color:var(--muted)}.faint{color:var(--faint)}.acc{color:var(--accent)}.num{font-variant-numeric:tabular-nums}
.eyebrow{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:10px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt28{margin-top:28px}
.diamond{display:inline-block;width:8px;height:8px;background:var(--accent);transform:rotate(45deg);flex:none}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:0;z-index:500;display:flex;align-items:center;gap:16px;padding:12px max(18px,env(safe-area-inset-right));padding-left:max(18px,env(safe-area-inset-left));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.wordmark{font:500 19px/1 var(--f-display);white-space:nowrap;display:flex;gap:10px;align-items:center;text-decoration:none}
.wordmark .t13{color:var(--accent)}
.wordmark small{font:500 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-left:10px;border-left:1px solid var(--line2)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav a{padding:8px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;font-size:13px;white-space:nowrap}
.nav a:hover{color:var(--fg)}
.nav a.on{color:var(--fg);background:var(--panel2)}
.nav a.on::before{content:"";display:inline-block;width:6px;height:6px;background:var(--accent);transform:rotate(45deg);margin-right:8px;vertical-align:1px}
.who{display:flex;align-items:center;gap:8px;flex:none}
.av{width:32px;height:32px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font:600 11px var(--f-body);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.testbar{background:var(--accent);color:var(--on-accent);font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:5px 12px}
@media (max-width:820px){.wordmark small{display:none}.topbar{flex-wrap:wrap}.nav{order:3;flex-basis:100%}}

/* controls */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);font-weight:500;font-size:13px;cursor:pointer;transition:transform .45s var(--spring),background .2s,border-color .2s,opacity .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:scale(.95);transition-duration:.12s}
.btn.primary{background:#FF5101;color:#12100E;border-color:transparent;font-weight:600}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);transform:translateX(-130%);transition:transform .9s var(--ease);pointer-events:none}
.btn.primary:hover::after{transform:translateX(130%)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:transparent}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:transparent}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.lg{padding:14px 18px;font-size:15px;border-radius:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.busy{pointer-events:none;opacity:.7}
.btn.busy::before{content:"";width:13px;height:13px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);pointer-events:none;animation:ripple .65s var(--ease) forwards}
@keyframes ripple{to{transform:scale(4.2);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.switch{position:relative;width:46px;height:28px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;flex:none;padding:0;transition:background .3s}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .5s var(--spring),background .3s}
.switch[aria-checked="true"]{background:var(--accent);border-color:transparent}
.switch[aria-checked="true"] i{transform:translateX(18px);background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .25s,color .25s,transform .4s var(--spring)}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 10px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;padding:5px 8px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.acc{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.seg{display:flex;padding:3px;gap:2px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 0 var(--line2)}
label.f{display:block}
label.f>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.field{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:11px 13px;outline:none;transition:border-color .2s,box-shadow .3s}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}
textarea.field{resize:vertical;min-height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card h3{font:500 17px var(--f-display)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.note{border-radius:14px;padding:12px 14px;font-size:13px;background:var(--panel);border:1px solid var(--line)}
.note.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 9%,var(--panel))}
.note.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 8%,var(--panel))}
.note.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:13px}
.loader{display:grid;place-items:center;padding:60px}
.loader i{width:34px;height:34px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:spin .8s linear infinite}
.fresh{animation:freshIn .7s var(--spring) both}
@keyframes freshIn{from{opacity:0;transform:translateY(-12px) scale(.98)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .45s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* layout */
.page{max-width:1240px;margin:0 auto;padding:28px max(18px,env(safe-area-inset-right)) 80px max(18px,env(safe-area-inset-left))}
.narrow{max-width:520px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 120px max(16px,env(safe-area-inset-left))}
.h-display{font:400 clamp(30px,4vw,52px)/1.04 var(--f-display);letter-spacing:-.02em}
.h-display em{font-style:italic;color:var(--accent)}
.lede{color:var(--muted);max-width:62ch;margin-top:12px;font-size:15px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:30px}
.role{display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:20px;border:1px solid var(--line);background:var(--panel);text-decoration:none;transition:transform .5s var(--spring),border-color .3s}
.role:hover{transform:translateY(-3px);border-color:var(--faint)}
.role h3{font:400 24px var(--f-display)}
.role .ic{width:44px;height:44px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;color:var(--accent)}
.role .ic svg{width:22px;height:22px}
.auth{max-width:420px;margin:40px auto;padding:0 18px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border-radius:14px;border:1px solid var(--line2);background:#fff;color:#1f1f1f;font-weight:600;cursor:pointer;transition:transform .45s var(--spring)}
.gbtn:active{transform:scale(.97)}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* customer */
.cust{background:var(--bg);min-height:calc(100vh - 60px)}
.search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
.search svg{width:17px;height:17px;color:var(--muted)}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px -16px 0;padding:0 16px}
.store{display:flex;gap:12px;width:100%;border:0;background:none;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;align-items:center;transition:transform .45s var(--spring);text-decoration:none;color:inherit}
.store:active{transform:scale(.98)}
.store.closed{opacity:.55}
.cover{position:relative;flex:none;width:76px;height:76px;border-radius:16px;background:#1A1512;color:#ECE6DC;overflow:hidden;display:flex;align-items:flex-end;padding:8px}
.cover::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(255,255,255,.04) 9px 10px)}
.cover .cv{position:absolute;right:-6px;top:-6px;width:50px;height:50px;color:#FF5101}
.cover .cv svg{width:100%;height:100%;stroke-width:1}
.cover em{position:relative;font:italic 400 12px/1 var(--f-display)}
.cover.lg{width:100%;height:150px;border-radius:20px;padding:18px}
.cover.lg .cv{width:140px;height:140px;right:-16px;top:auto;bottom:-28px}
.rate{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600}
.rate svg{width:12px;height:12px;color:var(--accent);fill:currentColor}
.item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.item.out{opacity:.5}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font:500 9.5px/1 var(--f-mono);letter-spacing:.06em;padding:4px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--muted)}
.tag.sp{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.add{min-width:36px;height:36px;border-radius:18px;border:0;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:600;cursor:pointer;transition:transform .45s var(--spring);flex:none;padding:0 10px}
.add:active{transform:scale(.85)}
.add.has{background:#FF5101;color:#12100E}
.add svg{width:16px;height:16px}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(488px,calc(100% - 32px));z-index:400;display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;border-radius:18px;background:#14110C;color:#ECE6DC;cursor:pointer;animation:cartIn .6s var(--spring);box-shadow:0 20px 40px -18px rgba(0,0,0,.6);text-decoration:none}
.cartbar .cnt{min-width:26px;height:26px;border-radius:8px;background:#FF5101;color:#12100E;display:grid;place-items:center;font-weight:700;font-size:12px}
@keyframes cartIn{from{transform:translate(-50%,120%);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.stepper button{width:34px;height:34px;border:0;background:transparent;cursor:pointer;font-size:16px}
.stepper span{min-width:30px;text-align:center;font-weight:600}
.bill div{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;font-variant-numeric:tabular-nums}
.bill .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:600;font-size:15px}
.paym{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;margin-top:8px;text-align:left}
.paym.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.pm-ic svg{width:16px;height:16px}
.btn svg{width:16px;height:16px;flex:none}.row>.btn{flex:none}.row>.field{flex:1;min-width:0}
.paym>svg{width:18px;height:18px;flex:none;opacity:.55}.paym .grow{white-space:normal;line-height:1.35}
.pm-ic{width:40px;height:26px;border-radius:6px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:600 9px var(--f-mono);flex:none}
.slide{position:relative;height:60px;border-radius:999px;background:#14110C;color:#ECE6DC;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;margin-top:16px;--x:0px}
.slide .s-fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--x) + 60px);background:#FF5101;border-radius:999px}
.slide .s-lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;background:linear-gradient(90deg,#8E877B 0%,#ECE6DC 45%,#8E877B 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.6s linear infinite;pointer-events:none}
@keyframes shine{from{background-position:200% 0}to{background-position:0 0}}
.slide .s-knob{position:absolute;left:5px;top:5px;width:50px;height:50px;border-radius:50%;background:#FF5101;color:#12100E;display:grid;place-items:center;transform:translateX(var(--x));cursor:grab}
.slide .s-knob svg{width:20px;height:20px}
.slide.snap .s-knob,.slide.snap .s-fill{transition:transform .55s var(--spring),width .55s var(--spring)}
.steps{list-style:none;margin:16px 0 4px;padding:0}
.steps li{position:relative;padding:0 0 16px 30px;font-size:13px}
.steps li::before{content:"";position:absolute;left:6px;top:16px;bottom:-2px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps li::after{content:"";position:absolute;left:0;top:2px;width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);background:var(--bg);box-sizing:border-box;transition:all .5s var(--spring)}
.steps li.done::after,.steps li.done::before{background:var(--accent);border-color:var(--accent)}
.steps li.cur::after{border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 18%,transparent)}
.steps li:not(.done):not(.cur){color:var(--faint)}
.pin{display:flex;gap:6px}
.pin span{width:40px;height:48px;border-radius:10px;background:var(--panel);border:1px solid var(--line2);display:grid;place-items:center;font:500 22px var(--f-mono)}
.eta-v{font:500 40px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.stars{display:flex;gap:8px}
.stars button{background:none;border:0;cursor:pointer;padding:2px;transition:transform .45s var(--spring)}
.stars svg{width:34px;height:34px;color:var(--line2);fill:currentColor}
.stars .on svg{color:var(--accent)}

/* maps */
.mapbox{width:100%;border-radius:18px;overflow:hidden;background:#0E0D0B;border:1px solid var(--line);z-index:1}
.light .mapbox{background:#EAE3D6}
.leaflet-container{font-family:var(--f-body)}
.mk-m{width:14px;height:14px;background:#FF5101;transform:rotate(45deg);border:2px solid #0B0A08}
.mk-m.off{background:#5F5A50}
.mk-c{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #14110C}
.mk-d{width:16px;height:16px;border-radius:50%;background:#FF5101;border:2px solid #fff;box-shadow:0 0 0 6px rgba(255,81,1,.22)}
.mk-d.demo{background:#8E877B;box-shadow:none;width:11px;height:11px}
.mk-d.busy{background:#ECE6DC}
.mk-o{width:9px;height:9px;border-radius:50%;background:#ECE6DC;border:2px solid #0B0A08}
.leaflet-marker-icon{transition:transform .9s linear}
.leaflet-zoom-anim .leaflet-marker-icon,.leaflet-marker-draggable{transition:none}
@media (max-width:560px){.hide-sm{display:none}}

/* merchant / courier / admin */
.ord{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:14px;margin-top:10px}
.ord.new{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 18px 40px -24px color-mix(in srgb,var(--accent) 60%,transparent)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:980px){.board{grid-template-columns:1fr}}
.prog{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .9s linear}
.mitem{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}@media(max-width:520px){.mitem{flex-wrap:wrap}.mitem>.grow{flex-basis:100%}}
.console{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 92px)}
.side{border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:92px;height:calc(100vh - 92px);overflow-y:auto}
.side .eyebrow{padding:0 10px 10px}

function onDb(t,p){
  const n=p.new||{};const o=p.old||{};

const maps={};
function mapBox(id,h){return `<div class="mapbox" data-map-id="${id}" style="height:${h}px"></div>`}
function getMap(id,opt){
  const el=$(`[data-map-id="${id}"]`);if(!el||!window.L)return null;
  let m=maps[id];
  if(m&&m.el!==el){try{m.map.remove()}catch(e){}m=null}
  if(!m){const mk=S.settings.market;const map=L.map(el,{zoomControl:true,scrollWheelZoom:opt&&opt.wheel!==false}).setView([opt?.lat??mk.lat,opt?.lng??mk.lng],opt?.zoom??mk.zoom??13);L.tileLayer(opt?.light?TILE_LIGHT:TILE_DARK,{attribution:TILE_ATTR,maxZoom:19,maxNativeZoom:opt?.light?19:16}).addTo(map);m={el,map,mk:{},fitted:false};maps[id]=m;setTimeout(()=>map.invalidateSize(),50)}
  else setTimeout(()=>m.map.invalidateSize(),30);
  return m;
}
function setMarkers(m,list){
  if(!m)return;const keep=new Set();
  for(const x of list){if(x.lat==null||x.lng==null)continue;keep.add(x.key);let mk=m.mk[x.key];const html=`<div class="${x.cls}"></div>`;
    if(!mk){mk=L.marker([x.lat,x.lng],{icon:L.divIcon({className:'',html,iconSize:[18,18],iconAnchor:[9,9]}),draggable:!!x.drag,keyboard:false});if(x.label)mk.bindTooltip(x.label,{direction:'top',offset:[0,-8]});if(x.onDrag)mk.on('dragend',e=>x.onDrag(e.target.getLatLng()));if(x.onClick)mk.on('click',x.onClick);mk.addTo(m.map);mk._cls=x.cls;m.mk[x.key]=mk}
    else{mk.setLatLng([x.lat,x.lng]);if(mk._cls!==x.cls){mk.setIcon(L.divIcon({className:'',html,iconSize:[18,18],iconAnchor:[9,9]}));mk._cls=x.cls}if(x.label)mk.setTooltipContent(x.label)}}
  for(const k of Object.keys(m.mk))if(!keep.has(k)){m.map.removeLayer(m.mk[k]);delete m.mk[k]}
}
function fit(m,pts,force){if(!m||(m.fitted&&!force))return;const p=pts.filter(x=>x&&x[0]!=null);if(p.length>1){m.map.fitBounds(L.latLngBounds(p),{padding:[40,40],maxZoom:16})}else if(p.length===1)m.map.setView(p[0],15);m.fitted=true}
async function reverseGeocode(lat,lng){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&lat=${lat}&lon=${lng}`,{headers:{'Accept-Language':'en'}});const j=await r.json();const a=j.address||{};return [a.house_number,a.road,a.suburb||a.neighbourhood,a.city||a.town||a.village].filter(Boolean).join(', ')||j.display_name||''}catch(e){return ''}}
async function geocode(q){const mk=S.settings.market;try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(q)}&viewbox=${mk.lng-0.3},${mk.lat+0.3},${mk.lng+0.3},${mk.lat-0.3}`,{headers:{'Accept-Language':'en'}});return await r.json()}catch(e){return []}}
S.ost={};
function ostPrev(id){if(S.ost[id]!==undefined)return S.ost[id];let found;const look=v=>{if(found!==undefined||!v||typeof v!=='object')return;if(Array.isArray(v)){v.forEach(look);return}if(v.id===id&&typeof v.status==='string'){found=v.status;return}};Object.values(S.data||{}).forEach(v=>{look(v);if(v&&typeof v==='object'&&!Array.isArray(v))Object.values(v).forEach(look)});return found}
function inMarket(lat,lng){const mk=S.settings&&S.settings.market;if(!mk||lat==null)return true;return km(lat,lng,mk.lat,mk.lng)<=60}
function locate(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>{const q={lat:p.coords.latitude,lng:p.coords.longitude};if(!inMarket(q.lat,q.lng)){toast('You are outside '+((S.settings.market||{}).city||'the test city')+', so a simulated location there is used.');return res(null)}res(q)},()=>res(null),{enableHighAccuracy:true,timeout:8000,maximumAge:30000})})}

function aSettings(){const mk=S.settings.market,pr=S.settings.pricing,dm=S.settings.demo;
  return aHead('Configuration','Market, pricing & demo','')+`<div class="g2e"><form class="card stack" data-f="market"><h3>Market</h3><div class="grid2"><label class="f"><span>City</span><input class="field" name="city" value="${esc(mk.city||'')}"></label><label class="f"><span>Currency code</span><input class="field" name="currency" value="${esc(mk.currency||'')}"></label></div><div class="grid2"><label class="f"><span>Currency symbol</span><input class="field" name="symbol" value="${esc(mk.symbol||'')}"></label><label class="f"><span>Map zoom</span><input class="field" name="zoom" type="number" value="${mk.zoom||13}"></label></div><div class="grid2"><label class="f"><span>Centre latitude</span><input class="field" name="lat" value="${mk.lat}"></label><label class="f"><span>Centre longitude</span><input class="field" name="lng" value="${mk.lng}"></label></div><p class="faint" style="font-size:12px">Prices are stored in this currency. Changing it does not convert existing menus.</p><button class="btn primary">Save market</button></form>
  <form class="card stack" data-f="pricing"><h3>Pricing & policy</h3><div class="grid2"><label class="f"><span>Commission %</span><input class="field" name="commission" type="number" step="0.5" value="${pr.commission}"></label><label class="f"><span>Tax %</span><input class="field" name="tax_pct" type="number" step="0.1" value="${pr.tax_pct}"></label></div><div class="grid2"><label class="f"><span>Base delivery fee</span><input class="field" name="base_fee" type="number" step="0.5" value="${pr.base_fee}"></label><label class="f"><span>Per km after 2 km</span><input class="field" name="per_km" type="number" step="0.1" value="${pr.per_km}"></label></div><div class="grid2"><label class="f"><span>Surge multiplier</span><input class="field" name="surge" type="number" step="0.05" min="1" value="${pr.surge}"></label><label class="f"><span>Courier share of fee %</span><input class="field" name="courier_share" type="number" step="1" value="${pr.courier_share}"></label></div><label class="f"><span>Refund auto-approval limit</span><input class="field" name="refund_limit" type="number" step="1" value="${pr.refund_limit}"></label><button class="btn primary">Save pricing</button></form></div>
  <div class="card row between wrap"><div><h3>Demo traffic</h3><p class="muted mt8" style="font-size:13px">Labelled demo restaurants and couriers generate background orders every 20 seconds. Demo kitchens also auto-accept real orders placed with them.</p></div><button class="switch" role="switch" aria-checked="${!!dm.traffic}" data-a="demoTraffic" aria-label="Demo traffic"><i></i></button></div>`}
function aAudit(A){return aHead('Governance','Audit log','')+`<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead><tbody>${A.audit.map(a=>`<tr><td class="muted">${dt(a.created_at)}</td><td>${esc(a.actor_email||'system')}</td><td class="mono acc">${esc(a.action)}</td><td style="white-space:normal;max-width:480px">${esc(String(a.detail||'').slice(0,240))}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No admin actions recorded yet.</td></tr>'}</tbody></table></div></div>`}
function aInsights(A){const s=stats(A);const byM={};s.del.forEach(o=>{const k=o.merchant_id;byM[k]=byM[k]||{n:0,late:0,gov:0};byM[k].n++;byM[k].gov+=Number(o.subtotal);if(o.promised_at&&new Date(o.delivered_at)>new Date(o.promised_at))byM[k].late++});const ranked=Object.entries(byM).sort((a,b)=>b[1].late/b[1].n-a[1].late/a[1].n);
  const brief=`Today ${S.ui.showDemo?'(including demo traffic)':'(real orders only)'}: ${s.live.length} orders worth ${moneyK(s.gov)}, ${s.onTime==null?'no deliveries completed yet':Math.round(s.onTime*100)+'% delivered on time'}. Contribution is ${moneyK(s.contrib)} after courier pay and ${moneyK(s.refunds)} of refunds. ${s.late.length?s.late.length+' active orders are running late.':'No active orders are late.'} ${A.refunds.filter(r=>r.status==='pending').length} refunds and ${A.merchants.filter(m=>m.status==='pending').length+A.couriers.filter(c=>c.status==='pending').length} partner applications are waiting for a decision.`;
  return aHead('Executive','Business briefing','')+`<div class="card"><p class="serif" style="font-size:20px;line-height:1.5;max-width:70ch">${esc(brief)}</p></div>
  <div class="g2e mt12"><div class="card"><div class="card-h"><h3>Late deliveries by restaurant</h3></div>${ranked.slice(0,6).map(([id,v])=>`<div class="mitem"><span class="grow">${esc(A.m[id]?.name||'')}</span><div class="lbar" style="width:120px"><i style="width:${v.late/v.n*100}%;background:var(--warn)"></i></div><span class="mono muted" style="width:70px;text-align:right">${v.late}/${v.n}</span></div>`).join('')||'<p class="muted">No deliveries yet today.</p>'}</div>
  <div class="card"><div class="card-h"><h3>Unit economics today</h3></div><div class="bill"><div><span class="muted">Gross order value</span><span>${money(s.gov)}</span></div><div><span class="muted">Platform revenue</span><span>${money(s.revenue)}</span></div><div><span class="muted">Refunds</span><span>−${money(s.refunds)}</span></div><div class="tot"><span>Contribution</span><span>${money(s.contrib)}</span></div><div><span class="muted">Per delivered order</span><span>${money(s.del.length?s.contrib/s.del.length:0)}</span></div></div></div></div>
  <p class="faint mt12" style="font-size:12px">Figures are computed from the order ledger in real time. Connecting an LLM for natural-language questions needs a server-side API key and is the next step.</p>`}

/* ============ Modal ============ */
function openModal(html){$('#modal').innerHTML=`<div class="modal-bg" data-a="bgClose"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){$('#modal').innerHTML='';Object.keys(maps).forEach(k=>{if(['addrmap'].includes(k)){try{maps[k].map.remove()}catch(e){}delete maps[k]}});if(S.ui.pending){S.ui.pending=false;softRender()}}

/* ============ Actions ============ */
async function withBusy(btn,fn){if(btn)btn.classList.add('busy');try{await fn()}catch(e){toast(errMsg(e),true)}finally{if(btn&&btn.isConnected)btn.classList.remove('busy')}}
const H={
  reload:()=>render(),
  closeModal:()=>closeModal(),
  bgClose:(v,el,e)=>{if(e.target===el)closeModal()},
  authTab:v=>{S.ui.authTab=v;render()},
  demoLogin:(v,b)=>withBusy(b,async()=>{const d=DEMO_LOGINS[+v];lsSet('dc13-next',d.next);const {error}=await sb.auth.signInWithPassword({email:d.email,password:d.pw});if(error)throw error}),
  google:(v,b)=>withBusy(b,async()=>{const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:redirectUrl()}});if(error)throw error}),
  resend:(v,b)=>withBusy(b,async()=>{const {error}=await sb.auth.resend({type:'signup',email:S.ui.verifyEmail,options:{emailRedirectTo:redirectUrl()}});if(error)throw error;toast('Verification email sent again')}),
  signout:async()=>{stopWatch();await sb.auth.signOut();S.ui.cart={mid:null,items:[]};saveCart();location.hash='#/'},
  cat:v=>{S.ui.cat=v;render({soft:true})},
  cartAdd:(v,b)=>{const c=S.ui.cart;const mid=b.dataset.m;if(c.mid&&c.mid!==mid&&c.items.length){openModal(`<h2 class="serif" style="font-size:24px">Start a new cart?</h2><p class="muted mt8">Your cart has items from ${esc(c.mname||'another restaurant')}.</p><div class="row mt20"><button class="btn ghost grow" data-a="closeModal">Keep cart</button><button class="btn primary grow" data-a="newCart" data-v="${v}" data-m="${mid}">New cart</button></div>`);return}addToCart(v,mid)},
  newCart:(v,b)=>{S.ui.cart={mid:null,items:[]};closeModal();addToCart(v,b.dataset.m)},
  cartDec:v=>{const c=S.ui.cart;const it=c.items.find(x=>x.id===v);if(!it)return;it.qty--;if(it.qty<=0)c.items=c.items.filter(x=>x!==it);if(!c.items.length){c.mid=null}saveCart();render({soft:true})},
  mode:v=>{S.ui.mode=v;if(v==='pickup'&&S.ui.pay==='cash')S.ui.pay='card';render({soft:true})},
  tip:v=>{S.ui.tip=+v;render({soft:true})},
  pay:v=>{S.ui.pay=v;render({soft:true})},
  promo:async(v,b)=>{const code=($('#promo')?.value||'').trim().toUpperCase();if(!code){S.ui.promo='';S.data.promo=null;S.ui.promoMsg='';return render({soft:true})}const {data}=await sb.from('promos').select('*').eq('code',code).eq('active',true).maybeSingle();if(data){S.ui.promo=code;S.data.promo=data;S.ui.promoMsg=`${code} applied`}else{S.ui.promo='';S.data.promo=null;S.ui.promoMsg=`${code} is not a valid code`}render({soft:true})},
  addrOpen:()=>{S.ui.addrDraft=null;addrModal()},
  addrPick:v=>{const a=(S.data.addrs||[]).find(x=>x.id===v);if(a){S.ui.addr={line:a.line,lat:a.lat,lng:a.lng,label:a.label};render({soft:true})}},
  addrDel:async v=>{await sb.from('addresses').delete().eq('id',v);render({soft:true})},
  geoMe:async(v,b)=>withBusy(b,async()=>{const p=await locate();if(!p)throw new Error('Your location is unavailable or outside the test city. Search for an address or drag the pin.');const a=S.ui.addrDraft;a.lat=p.lat;a.lng=p.lng;const m=maps.addrmap;if(m){m.map.setView([p.lat,p.lng],17);setMarkers(m,[{key:'pin',lat:p.lat,lng:p.lng,cls:'mk-c',drag:true,onDrag:ll=>{a.lat=ll.lat;a.lng=ll.lng}}])}const line=await reverseGeocode(p.lat,p.lng);if(line)$('#aline').value=line}),
  geoSearch:async(v,b)=>withBusy(b,async()=>{const q=$('#geoq').value.trim();if(!q)return;const r=await geocode(q);$('#georesults').innerHTML=r.length?r.map((x,i)=>`<button class="mitem" style="width:100%;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer;text-align:left" data-a="geoPick" data-v="${x.lat},${x.lon}" data-l="${esc(x.display_name)}"><span class="grow" style="font-size:12.5px">${esc(x.display_name)}</span></button>`).join(''):'<p class="muted mt8" style="font-size:12.5px">No matches. Try a nearby landmark or drop the pin.</p>'}),
  geoPick:(v,b)=>{const [lat,lng]=v.split(',').map(Number);const a=S.ui.addrDraft;a.lat=lat;a.lng=lng;$('#aline').value=b.dataset.l.split(',').slice(0,3).join(',');$('#georesults').innerHTML='';const m=maps.addrmap;if(m){m.map.setView([lat,lng],17);setMarkers(m,[{key:'pin',lat,lng,cls:'mk-c',drag:true,onDrag:ll=>{a.lat=ll.lat;a.lng=ll.lng}}])}},
  addrSave:async(v,b)=>withBusy(b,async()=>{const a=S.ui.addrDraft;const line=$('#aline').value.trim();if(!line)throw new Error('Add an address line so the courier can find you');a.line=line;a.label=$('#alabel').value;if($('#asave').checked){const {error}=await sb.from('addresses').insert({label:a.label,line,lat:a.lat,lng:a.lng});if(error)throw error}S.ui.addr={...a};closeModal();render({soft:true})}),
  custCancel:(v,b)=>{openModal(`<h2 class="serif" style="font-size:24px">Cancel this order?</h2><p class="muted mt8">The kitchen hasn't accepted it yet, so card and wallet payments are refunded in full.</p><div class="row mt20"><button class="btn ghost grow" data-a="closeModal">Keep order</button><button class="btn danger grow" data-a="custCancelGo" data-v="${v}">Cancel order</button></div>`)},
  custCancelGo:(v,b)=>withBusy(b,async()=>{await rpc('customer_cancel',{p_order:+v});closeModal();toast('Order cancelled');render({soft:true})}),
  star:v=>{S.ui.stars=+v;render({soft:true})},
  rate:(v,b)=>withBusy(b,async()=>{await rpc('customer_rate',{p_order:+v,p_rating:S.ui.stars,p_feedback:$('#fb')?.value||''});S.ui.stars=0;toast('Thanks for the feedback');render({soft:true})}),
  refundOpen:v=>{const o=S.data.order;openModal(`<h2 class="serif" style="font-size:24px">Report a problem</h2><p class="muted mt8">Choose what went wrong. Refunds up to ${money(S.settings.pricing.refund_limit)} are approved instantly; larger ones go to a specialist.</p><form class="stack mt16" data-f="refund" data-id="${o.id}">${(o.items||[]).map((i,k)=>`<label class="paym" style="margin:0"><input type="checkbox" name="it" value="${k}"> <span class="grow">${i.qty}× ${esc(i.name)}</span><span>${money(i.qty*i.price)}</span></label>`).join('')}<select class="field" name="reason"><option>Item missing</option><option>Wrong item</option><option>Arrived cold or damaged</option><option>Order never arrived</option></select><button class="btn primary">Request refund</button></form>`)},
  // restaurant
  mTab:v=>{S.ui.mTab=v;S.ui.noLive=false;render({soft:true})},
  editMerchant:()=>{S.ui.editMerchant=true;render()},
  cancelEdit:()=>{S.ui.editMerchant=false;S.ui.editCourier=false;S.ui.noLive=false;render()},
  mOpen:(v,b)=>withBusy(b,async()=>{const m=S.data.merchant;const {error}=await sb.from('merchants').update({is_open:!m.is_open}).eq('id',m.id);if(error)throw error;render({soft:true})}),
  prep:v=>{const [id,d]=v.split(':');S.ui.prep[id]=clamp((S.ui.prep[id]||S.data.merchant.prep_min)+(+d),1,120);render({soft:true})},
  mAccept:(v,b)=>withBusy(b,async()=>{await rpc('merchant_accept',{p_order:+v,p_prep:S.ui.prep[v]||S.data.merchant.prep_min});render({soft:true})}),
  mRejectOpen:v=>openModal(`<h2 class="serif" style="font-size:24px">Reject FD-${v}?</h2><p class="muted mt8">The customer is refunded automatically.</p><div class="stack mt16">${['Item unavailable','Kitchen too busy','Closing soon'].map(r=>`<button class="paym" data-a="mReject" data-v="${v}|${r}"><span class="grow">${r}</span></button>`).join('')}</div>`),
  mReject:(v,b)=>withBusy(b,async()=>{const [id,r]=v.split('|');await rpc('merchant_reject',{p_order:+id,p_reason:r});closeModal();render({soft:true})}),
  mReady:(v,b)=>withBusy(b,async()=>{await rpc('merchant_ready',{p_order:+v});render({soft:true})}),
  mCollected:(v,b)=>withBusy(b,async()=>{await rpc('merchant_collected',{p_order:+v});render({soft:true})}),
  itemOpen:async v=>{if(!v)return itemModal(null);const {data}=await sb.from('menu_items').select('*').eq('id',v).maybeSingle();itemModal(data)},
  itemAvail:(v,b)=>withBusy(b,async()=>{const on=b.getAttribute('aria-checked')==='true';const {error}=await sb.from('menu_items').update({available:!on}).eq('id',v);if(error)throw error;render({soft:true})}),
  itemDel:(v,b)=>withBusy(b,async()=>{const {error}=await sb.from('menu_items').delete().eq('id',v);if(error)throw error;closeModal();render({soft:true})}),
  // courier
  editCourier:()=>{S.ui.editCourier=true;render()},
  goOnline:(v,b)=>withBusy(b,async()=>{const p=await locate();const mk=S.settings.market;await rpc('courier_set_online',{p_on:true,p_lat:p?.lat??mk.lat,p_lng:p?.lng??mk.lng});if(!p)toast('Location unavailable. Using the city centre; use simulated driving to test.');startWatch();render({soft:true})}),
  goOffline:(v,b)=>withBusy(b,async()=>{await rpc('courier_set_online',{p_on:false,p_lat:null,p_lng:null});stopWatch();render({soft:true})}),
  claim:(v,b)=>withBusy(b,async()=>{await rpc('courier_claim',{p_order:+v});S.ui.pin='';toast('Delivery accepted');if(maps.dmap)maps.dmap.fitted=false;render({soft:true})}),
  dPickup:(v,b)=>withBusy(b,async()=>{await rpc('courier_pickup',{p_order:+v});if(maps.dmap)maps.dmap.fitted=false;render({soft:true})}),
  key:v=>{if(v==='del'){S.ui.pin=S.ui.pin.slice(0,-1);S.ui.pinErr='';return render({soft:true})}if(S.ui.pin.length>=4)return;S.ui.pin+=v;S.ui.pinErr='';if(S.ui.pin.length===4){const pin=S.ui.pin;rpc('courier_deliver',{p_order:S.data.dActive.id,p_pin:pin,p_method:'pin'}).then(()=>{S.ui.pin='';toast('Delivered. Nice work.');if(simTimer){clearInterval(simTimer);simTimer=null}render({soft:true})}).catch(e=>{S.ui.pinErr=errMsg(e);S.ui.pin='';render({soft:true})})}render({soft:true})},
  photoProof:()=>{openModal(`<h2 class="serif" style="font-size:24px">Photo proof of delivery</h2><p class="muted mt8">Use this only when the customer cannot share the PIN. Operations can audit photo deliveries.</p><input type="file" accept="image/*" capture="environment" class="field mt16" id="proofFile"><div class="row mt16"><button class="btn ghost grow" data-a="closeModal">Cancel</button><button class="btn primary grow" data-a="photoGo">Complete delivery</button></div>`)},
  photoGo:(v,b)=>withBusy(b,async()=>{if(!$('#proofFile').files[0])throw new Error('Take or choose a photo first');await rpc('courier_deliver',{p_order:S.data.dActive.id,p_pin:null,p_method:'photo'});closeModal();toast('Delivered with photo proof');render({soft:true})}),
  simToggle:()=>toggleSim(),
  // admin
  aTab:v=>{S.ui.adminTab=v;render()},
  demoView:()=>{S.ui.showDemo=!S.ui.showDemo;render({soft:true})},
  oFilter:v=>{S.ui.orderFilter=v;render({soft:true})},
  aOpenOrder:v=>aOpenOrder(+v),
  aAssign:(v,b)=>withBusy(b,async()=>{await rpc('admin_assign',{p_order:+v,p_courier:$('#assignSel').value});closeModal();toast('Courier assigned');render({soft:true})}),
  aCancel:(v,b)=>withBusy(b,async()=>{const r=$('#cancelReason').value.trim();if(!r)throw new Error('Add a reason for the audit log');await rpc('admin_cancel',{p_order:+v,p_reason:r});closeModal();toast('Order cancelled and refunded');render({soft:true})}),
  aAccept:(v,b)=>withBusy(b,async()=>{await rpc('merchant_accept',{p_order:+v,p_prep:null});closeModal();render({soft:true})}),
  aReady:(v,b)=>withBusy(b,async()=>{await rpc('merchant_ready',{p_order:+v});closeModal();render({soft:true})}),
  mStatus:(v,b)=>{const [id,st]=v.split('|');if(st==='approved'){return withBusy(b,async()=>{const {error}=await sb.from('merchants').update({status:st,review_note:null}).eq('id',id);if(error)throw error;toast('Restaurant '+st);render({soft:true})})}openModal(`<h2 class="serif" style="font-size:24px">${st==='rejected'?'Reject application':'Suspend restaurant'}</h2><label class="f mt16"><span>Note shown to the restaurant</span><textarea class="field" id="rnote" rows="3"></textarea></label><div class="row mt16"><button class="btn ghost grow" data-a="closeModal">Cancel</button><button class="btn danger grow" data-a="mStatusGo" data-v="${v}">Confirm</button></div>`)},
  mStatusGo:(v,b)=>withBusy(b,async()=>{const [id,st]=v.split('|');const {error}=await sb.from('merchants').update({status:st,review_note:$('#rnote').value||null,is_open:st==='approved'}).eq('id',id);if(error)throw error;closeModal();toast('Restaurant '+st);render({soft:true})}),
  cStatus:(v,b)=>{const [id,st]=v.split('|');if(st==='approved'){return withBusy(b,async()=>{const {error}=await sb.from('couriers').update({status:st,review_note:null}).eq('id',id);if(error)throw error;toast('Courier '+st);render({soft:true})})}openModal(`<h2 class="serif" style="font-size:24px">${st==='rejected'?'Reject application':'Suspend courier'}</h2><label class="f mt16"><span>Note shown to the courier</span><textarea class="field" id="rnote" rows="3"></textarea></label><div class="row mt16"><button class="btn ghost grow" data-a="closeModal">Cancel</button><button class="btn danger grow" data-a="cStatusGo" data-v="${v}">Confirm</button></div>`)},
  cStatusGo:(v,b)=>withBusy(b,async()=>{const [id,st]=v.split('|');const {error}=await sb.from('couriers').update({status:st,review_note:$('#rnote').value||null}).eq('id',id);if(error)throw error;closeModal();toast('Courier '+st);render({soft:true})}),
  viewDoc:(v,b)=>withBusy(b,async()=>{const {data,error}=await sb.storage.from('courier-docs').createSignedUrl(v,300);if(error)throw error;openModal(`<div class="row between"><h2 class="serif" style="font-size:22px">Licence document</h2><button class="btn sm ghost" data-a="closeModal">${ic('x')}</button></div>${/\.pdf$/i.test(v)?`<p class="mt16"><a class="btn" href="${esc(data.signedUrl)}" target="_blank" rel="noopener">Open PDF</a></p>`:`<img src="${esc(data.signedUrl)}" alt="Licence" style="width:100%;border-radius:12px;margin-top:16px">`}<p class="faint mt8" style="font-size:12px">Link expires in 5 minutes.</p>`)}),
  uStatus:(v,b)=>withBusy(b,async()=>{const [id,st]=v.split('|');const {error}=await sb.from('profiles').update({status:st}).eq('id',id);if(error)throw error;toast('Account '+st);render({soft:true})}),
  uAdmin:(v,b)=>withBusy(b,async()=>{const [id,on]=v.split('|');const {error}=await sb.from('profiles').update({is_admin:on==='1'}).eq('id',id);if(error)throw error;toast(on==='1'?'Admin access granted':'Admin access removed');render({soft:true})}),
  refund:(v,b)=>withBusy(b,async()=>{const [id,ok]=v.split('|');await rpc('admin_decide_refund',{p_id:+id,p_approve:ok==='1'});toast(ok==='1'?'Refund approved':'Refund rejected');render({soft:true})}),
  promoToggle:(v,b)=>withBusy(b,async()=>{const p=S.data.A.promos.find(x=>x.code===v);const {error}=await sb.from('promos').update({active:!p.active}).eq('code',v);if(error)throw error;render({soft:true})}),
  promoDel:(v,b)=>withBusy(b,async()=>{const {error}=await sb.from('promos').delete().eq('code',v);if(error)throw error;render({soft:true})}),
  zoneToggle:(v,b)=>withBusy(b,async()=>{const z=S.data.A.zones.find(x=>x.id===v);const {error}=await sb.from('zones').update({active:!z.active}).eq('id',v);if(error)throw error;render({soft:true})}),
  zoneDel:(v,b)=>withBusy(b,async()=>{const {error}=await sb.from('zones').delete().eq('id',v);if(error)throw error;render({soft:true})}),
  demoTraffic:(v,b)=>withBusy(b,async()=>{const val={...S.settings.demo,traffic:!S.settings.demo.traffic};const {error}=await sb.from('settings').update({value:val}).eq('key','demo');if(error)throw error;S.settings.demo=val;toast(val.traffic?'Demo traffic on':'Demo traffic off');render({soft:true})}),
};
async function addToCart(id,mid){const c=S.ui.cart;const {data:it}=await sb.from('menu_items').select('id,name,price,merchant_id').eq('id',id).maybeSingle();if(!it)return toast('That item is no longer available',true);if(!c.mid){c.mid=mid;const m=(S.data.merchants||[]).find(x=>x.id===mid);if(m)c.mname=m.name;else{const {data}=await sb.from('merchants').select('name').eq('id',mid).maybeSingle();c.mname=data?.name||''}}const ex=c.items.find(x=>x.id===id);if(ex)ex.qty++;else c.items.push({id,name:it.name,price:Number(it.price),qty:1});saveCart();render({soft:true})}

/* ============ Forms ============ */
const F={
  auth:async(fd,form)=>{const t=S.ui.authTab;const email=fd.get('email').trim();
    if(t==='signin'){const {error}=await sb.auth.signInWithPassword({email:email.toLowerCase(),password:String(fd.get('password')).trim()});if(error){if(/confirm/i.test(error.message)){S.ui.verifyEmail=email;location.hash='#/verify';return}throw error}return}
    if(t==='signup'){const {data,error}=await sb.auth.signUp({email,password:fd.get('password'),options:{data:{full_name:fd.get('name')},emailRedirectTo:redirectUrl()}});if(error)throw error;S.ui.verifyEmail=email;if(data.session)return;location.hash='#/verify';return}
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirectUrl()});if(error)throw error;toast('Check your email for a reset link');S.ui.authTab='signin';render()},
  newpw:async fd=>{const {error}=await sb.auth.updateUser({password:fd.get('password')});if(error)throw error;S.ui.recovery=false;toast('Password updated');location.hash='#/'},
  profile:async fd=>{const {error}=await sb.from('profiles').update({full_name:fd.get('full_name'),phone:fd.get('phone')}).eq('id',S.user.id);if(error)throw error;await loadProfile();toast('Profile saved');render({soft:true})},
  merchant:async fd=>{const m=S.data.merchant;const p=S.ui.mPin;const row={name:fd.get('name'),cuisine:fd.get('cuisine'),category:fd.get('category'),icon:ICON_BY_CAT[fd.get('category')]||'bowl',phone:fd.get('phone'),email:fd.get('email'),reg_number:fd.get('reg_number'),address_line:fd.get('address_line'),lat:p.lat,lng:p.lng,hours:fd.get('hours'),prep_min:+fd.get('prep_min')||15,delivery_fee:fd.get('delivery_fee')===''?null:+fd.get('delivery_fee'),payout_last4:fd.get('payout_last4')||null};
    const {error}=m?await sb.from('merchants').update(row).eq('id',m.id):await sb.from('merchants').insert(row);if(error)throw error;S.ui.editMerchant=false;S.ui.noLive=false;S.ui.mPin=null;toast(m?'Restaurant updated':'Application submitted for review');render()},
  item:async(fd,form)=>{const id=form.dataset.id;const row={name:fd.get('name'),price:+fd.get('price'),category:fd.get('category')||'Menu',description:fd.get('description')||null,tags:fd.getAll('tags'),allergens:String(fd.get('allergens')||'').split(',').map(s=>s.trim()).filter(Boolean)};
    const {error}=id?await sb.from('menu_items').update(row).eq('id',id):await sb.from('menu_items').insert({...row,merchant_id:S.data.merchant.id});if(error)throw error;closeModal();toast('Menu saved');render({soft:true})},
  courier:async fd=>{const c=S.data.courier;let path=c?.licence_path||null;const file=fd.get('licence');
    if(file&&file.size){if(file.size>5*1024*1024)throw new Error('Licence file must be under 5 MB');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');path=`${S.user.id}/licence-${Date.now()}.${ext}`;const {error:ue}=await sb.storage.from('courier-docs').upload(path,file,{upsert:false,contentType:file.type||undefined});if(ue)throw ue}
    const row={full_name:fd.get('full_name'),phone:fd.get('phone'),vehicle:fd.get('vehicle'),plate:fd.get('plate'),licence_no:fd.get('licence_no'),licence_path:path,zones:fd.getAll('zones')};
    const {error}=c?await sb.from('couriers').update(row).eq('id',c.id):await sb.from('couriers').insert(row);if(error)throw error;S.ui.editCourier=false;S.ui.noLive=false;toast(c?'Application updated':'Application submitted for review');render()},
  refund:async(fd,form)=>{const o=S.data.order;const idx=fd.getAll('it').map(Number);if(!idx.length)throw new Error('Select at least one item');const amt=idx.reduce((a,k)=>a+o.items[k].qty*o.items[k].price,0);const names=idx.map(k=>o.items[k].name).join(', ');const st=await rpc('request_refund',{p_order:o.id,p_amount:+amt.toFixed(2),p_reason:fd.get('reason')+': '+names});closeModal();toast(st==='approved'?`Refund of ${money(amt)} approved`:`Refund sent to a specialist for approval`);render({soft:true})},
  promo:async fd=>{const {error}=await sb.from('promos').insert({code:fd.get('code').trim().toUpperCase(),kind:fd.get('kind'),value:+fd.get('value')||0,max_discount:fd.get('max_discount')===''?null:+fd.get('max_discount')});if(error)throw error;toast('Promo created');render({soft:true})},
  zone:async fd=>{const {error}=await sb.from('zones').insert({name:fd.get('name'),lat:+fd.get('lat'),lng:+fd.get('lng'),radius_km:+fd.get('radius_km')||3,fee_multiplier:+fd.get('fee_multiplier')||1});if(error)throw error;toast('Zone added');render({soft:true})},
  market:async fd=>{const val={city:fd.get('city'),currency:fd.get('currency'),symbol:fd.get('symbol'),lat:+fd.get('lat'),lng:+fd.get('lng'),zoom:+fd.get('zoom')||13};const {error}=await sb.from('settings').update({value:val}).eq('key','market');if(error)throw error;S.settings.market=val;toast('Market saved');render({soft:true})},
  pricing:async fd=>{const val={};['commission','tax_pct','base_fee','per_km','surge','courier_share','refund_limit'].forEach(k=>val[k]=+fd.get(k));const {error}=await sb.from('settings').update({value:val}).eq('key','pricing');if(error)throw error;S.settings.pricing=val;toast('Pricing saved');render({soft:true})},
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;if(t.dataset.a==='bgClose'&&e.target!==t)return;const fn=H[t.dataset.a];if(fn){e.preventDefault();fn(t.dataset.v,t,e)}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();const fn=F[f.dataset.f];if(!fn)return;const btn=f.querySelector('button:not([type=button])');withBusy(btn,()=>fn(new FormData(f),f))});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.in==='cq'){S.ui.q=t.value;clearTimeout(t._d);t._d=setTimeout(async()=>{const q=S.ui.q.toLowerCase();const list=(S.data.merchants||[]).filter(m=>(S.ui.cat==='All'||m.category===S.ui.cat)&&(!q||(m.name+' '+(m.cuisine||'')+' '+m.category).toLowerCase().includes(q)));const el=$('#slist');if(el)el.innerHTML=list.map(m=>`<a class="store${m.is_open?'':' closed'}" href="#/eat/store/${m.id}">${cover(m)}<div class="grow"><b>${esc(m.name)}</b><div class="muted" style="font-size:12px">${esc(m.cuisine||'')}</div></div></a>`).join('')||'<div class="empty">No matches.</div>'},150)}if(t.dataset.in==='note')S.ui.note=t.value});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.chip,.add,.paym,.keypad button');if(b&&!b.disabled){const r=b.getBoundingClientRect();const s=Math.max(r.width,r.height);const sp=document.createElement('span');sp.className='ripple';sp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;if(getComputedStyle(b).position==='static')b.style.position='relative';b.appendChild(sp);setTimeout(()=>sp.remove(),700)}
  const k=e.target.closest('.s-knob');if(k)startSlide(k.closest('.slide'),e)});
function startSlide(sl,e){e.preventDefault();sl.classList.remove('snap');sl.classList.add('dragging');const max=sl.getBoundingClientRect().width-60;const x0=e.clientX;let x=0;
  const mv=ev=>{x=clamp(ev.clientX-x0,0,max);sl.style.setProperty('--x',x+'px')};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);sl.classList.remove('dragging');sl.classList.add('snap');if(x>=max*.86){sl.style.setProperty('--x',max+'px');placeOrder(sl)}else sl.style.setProperty('--x','0px')};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)}
async function placeOrder(sl){
  const c=S.ui.cart,a=S.ui.addr;
  if(S.ui.mode==='delivery'&&!a){sl.style.setProperty('--x','0px');toast('Add a delivery address first',true);return addrModal()}
  sl.querySelector('.s-lbl').textContent='Placing order…';
  try{const r=await rpc('place_order',{p_merchant:c.mid,p_items:c.items.map(i=>({id:i.id,qty:i.qty})),p_mode:S.ui.mode,p_pay:S.ui.pay,p_tip:S.ui.mode==='delivery'?S.ui.tip:0,p_promo:S.ui.promo||null,p_addr_line:a?.line||null,p_lat:a?.lat??null,p_lng:a?.lng??null,p_note:S.ui.note||null,p_name:S.profile?.full_name||'',p_phone:S.profile?.phone||''});
    S.ui.cart={mid:null,items:[]};saveCart();S.ui.promo='';S.data.promo=null;S.ui.promoMsg='';S.ui.note='';
    $('#main').innerHTML=`<div class="light cust"><div class="narrow" style="text-align:center;padding-top:80px"><svg class="check-anim" viewBox="0 0 72 72"><circle cx="36" cy="36" r="34"/><path d="m22 37 9 9 19-20"/></svg><h1 class="serif" style="font-size:30px">Order placed</h1><p class="muted mt8">${r.code} is on its way to the kitchen.</p></div></div>`;
    setTimeout(()=>{location.hash='#/eat/order/'+r.id},1200);
  }catch(e){toast(errMsg(e),true);sl.style.setProperty('--x','0px');sl.querySelector('.s-lbl').textContent='Slide to try again'}
}

/* ============ After render: maps ============ */
function afterRender(){
  const r=S.route[0];
  if(r==='eat'&&S.route[1]==='order'&&S.data.order&&$('[data-map-id="track"]')){const o=S.data.order,m=S.data.orderMerchant;const mp=getMap('track',{light:true,lat:o.lat,lng:o.lng,zoom:14});
    setMarkers(mp,[{key:'m',lat:m?.lat,lng:m?.lng,cls:'mk-m',label:m?.name},{key:'h',lat:o.lat,lng:o.lng,cls:'mk-c',label:'You'},...(o.courier_lat?[{key:'d',lat:o.courier_lat,lng:o.courier_lng,cls:'mk-d',label:o.courier_name||'Courier'}]:[])]);fit(mp,[[m?.lat,m?.lng],[o.lat,o.lng],[o.courier_lat,o.courier_lng]])}
  if(r==='drive'){const c=S.data.courier,a=S.data.dActive;
    if(a&&$('[data-map-id="dmap"]')){const m=S.data.dMerchants[a.merchant_id]||{};const mp=getMap('dmap',{lat:c.lat,lng:c.lng,zoom:14});setMarkers(mp,[{key:'me',lat:c.lat,lng:c.lng,cls:'mk-d',label:'You'},{key:'m',lat:m.lat,lng:m.lng,cls:'mk-m',label:m.name},{key:'h',lat:a.lat,lng:a.lng,cls:'mk-c',label:a.cust_name}]);fit(mp,[[c.lat,c.lng],[m.lat,m.lng],[a.lat,a.lng]])}
    if(!a&&$('[data-map-id="omap"]')){const mp=getMap('omap',{lat:c.lat,lng:c.lng,zoom:13});const l=[{key:'me',lat:c.lat,lng:c.lng,cls:'mk-d',label:'You'}];(S.data.offers||[]).forEach(o=>{const m=S.data.dMerchants[o.merchant_id];if(m)l.push({key:'m'+m.id,lat:m.lat,lng:m.lng,cls:'mk-m',label:m.name})});setMarkers(mp,l);fit(mp,l.map(x=>[x.lat,x.lng]))}
    if(c&&c.online)startWatch()}
}

/* ============ Boot ============ */
async function boot(){
  try{await loadSettings()}catch(e){}
  const {data:{session}}=await sb.auth.getSession();S.session=session;S.user=session?.user||null;
  if(S.user)await loadProfile();
  if(location.search.includes('code=')||location.search.includes('error')){const qs=new URLSearchParams(location.search);if(qs.get('error_description'))toast(qs.get('error_description'),true);history.replaceState(null,'',location.pathname+(S.user?(lsGet('dc13-next','#/')||'#/'):'#/login'));if(!S.user&&!qs.get('error_description'))toast('Email verified. Please sign in.')}
  sb.auth.onAuthStateChange(async(ev,session)=>{
    const prev=S.user?.id;S.session=session;S.user=session?.user||null;
    if(ev==='PASSWORD_RECOVERY'){S.ui.recovery=true;location.hash='#/reset';return}
    if(S.user&&S.user.id!==prev){await loadProfile();subscribe();const next=lsGet('dc13-next',null);lsSet('dc13-next',null);if(S.route[0]==='login'||S.route[0]==='verify'){location.hash=next&&next!=='#/login'?next:'#/eat'}else render({soft:true})}
    if(!S.user&&prev){if(channel){sb.removeChannel(channel);channel=null}S.profile=null;render()}
  });
  subscribe();
  addEventListener('hashchange',()=>{S.ui.noLive=false;S.ui.pending=false;closeModal();render()});
  render();
  setInterval(()=>{if(['eat','partner'].includes(S.route[0])&&!document.hidden)softRender()},30000);
}
boot();
